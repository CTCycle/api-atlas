name: Validate catalog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tables, values, ordering and navigation
        run: python scripts/catalog.py validate
      - name: Check the generated artifacts are current
        run: |
          python scripts/catalog.py export --format jsonl
          python scripts/catalog.py export --format json
          python scripts/catalog.py export --format csv
          python scripts/catalog.py shortlist
          if ! git diff --quiet -- data/ docs/no-auth.md; then
            echo "Generated files are stale. Run:"
            echo "  python scripts/catalog.py export --format jsonl"
            echo "  python scripts/catalog.py export --format json"
            echo "  python scripts/catalog.py export --format csv"
            echo "  python scripts/catalog.py shortlist"
            git diff --stat -- data/ docs/no-auth.md
            exit 1
          fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run catalog unit tests
        run: python -m unittest tests.test_catalog tests.test_probe tests.test_export -v

  linkcheck:
    # Manual only. Nothing is written back to the catalog; the report is an artifact.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Link check sample
        run: python scripts/catalog.py linkcheck --limit 400 --workers 6
      - name: Build maintenance report
        run: python scripts/catalog.py report
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-report
          path: reports/
