name: Validate catalog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tables, values, ordering and navigation
        run: python scripts/catalog.py validate
      - name: Check the machine-readable copy is current
        run: |
          python scripts/catalog.py export --format jsonl --out /tmp/catalog.jsonl
          if ! diff -q /tmp/catalog.jsonl data/catalog.jsonl >/dev/null; then
            echo "data/catalog.jsonl is stale. Run: python scripts/catalog.py export --format jsonl"
            diff /tmp/catalog.jsonl data/catalog.jsonl | head -40
            exit 1
          fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run catalog unit tests
        run: python -m unittest tests.test_catalog -v

  linkcheck:
    # Manual only. Nothing is written back to the catalog; the report is an artifact.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Link check sample
        run: python scripts/catalog.py linkcheck --limit 400 --workers 6
      - name: Build maintenance report
        run: python scripts/catalog.py report
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-report
          path: reports/
