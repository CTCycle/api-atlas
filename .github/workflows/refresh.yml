name: Refresh catalog

on:
  schedule:
    - cron: "0 4 1 * *"   # monthly, first day of month
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pyyaml jsonschema
      - name: Re-import upstream catalogs
        run: python -m regipy.cli import all --fetch
      - name: Re-apply provider policies and category inference
        run: python -m regipy.cli enrich
      - name: Full link check sweep
        run: python -m regipy.cli linkcheck --max-age-days 30
      - name: Deduplication review
        run: python -m regipy.cli dedupe --json > reports/dedupe-candidates.json
      - name: Rebuild search index
        run: python -m regipy.cli build
      - name: Validate catalog
        run: python -m regipy.cli validate --strict
      - name: Regenerate coverage report
        run: python scripts/report.py
      - name: Regenerate reference question checks
        run: python scripts/answer_checks.py
      - name: Run unit tests
        run: python -m pytest -q
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: refresh-reports
          path: reports/
