name: Link check

on:
  schedule:
    - cron: "0 6 1 * *"   # 1st of the month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Full link check
        run: python scripts/catalog.py linkcheck --workers 6
      - name: Build maintenance report
        run: python scripts/catalog.py report
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-report
          path: reports/
