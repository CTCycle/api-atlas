name: Link check

on:
  schedule:
    - cron: "0 6 1 * *"   # 1st of the month, 06:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Random sample size (0 = every URL)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: linkcheck
  cancel-in-progress: true

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify every link, following redirects
        run: python scripts/catalog.py verify --workers 6 --limit ${{ github.event.inputs.limit || 0 }}
      - name: Group the findings by the decision each row needs
        run: python scripts/catalog.py triage
      - name: Look for live OpenAPI and Swagger documents
        run: |
          python -m pip install --quiet pyyaml   # optional: adds YAML specs to the probe
          python scripts/probe.py --workers 6 --index reports/openapi-index.json
      - name: Build the maintenance report
        run: python scripts/catalog.py report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-report
          path: reports/
          if-no-files-found: warn
