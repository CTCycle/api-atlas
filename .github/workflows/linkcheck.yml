name: Link check

on:
  schedule:
    - cron: "0 6 1 * *"   # 1st of the month, 06:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Random sample size (0 = every URL)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify every link, following redirects
        run: python scripts/catalog.py verify --workers 6 --limit ${{ github.event.inputs.limit || 0 }}
      - name: Group the findings by the decision each row needs
        run: python scripts/catalog.py triage
      - name: Look for live OpenAPI and Swagger documents
        run: python scripts/probe.py --workers 6
      - name: Build the maintenance report
        run: python scripts/catalog.py report
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-report
          path: reports/
