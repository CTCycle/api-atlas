# Provider level policies applied during import.
#
# These rules only fire when the entry's provider domain matches one of the
# `match` values. They encode published, citable licensing for well documented
# providers. Nothing here is a guess: every rule points at the page that states
# the terms. When a provider is not listed, license fields stay `unknown`.
#
# Allowed commercial_use values: allowed | restricted | prohibited | unknown
version: 1

rules:
  - match: ["data.worldbank.org", "worldbank.org"]
    license:
      name: Creative Commons Attribution 4.0
      spdx: CC-BY-4.0
      url: https://datacatalog.worldbank.org/public-licenses
      commercial_use: allowed
      attribution_required: true
    coverage:
      geographic: Global, country and aggregate level

  - match: ["data.europa.eu", "europa.eu"]
    license:
      name: Creative Commons Attribution 4.0 (most datasets)
      spdx: CC-BY-4.0
      url: https://data.europa.eu/en/content/legal-notice
      commercial_use: allowed
      attribution_required: true

  - match: ["ec.europa.eu", "eurostat.ec.europa.eu"]
    license:
      name: Eurostat copyright notice, reuse permitted with attribution
      spdx: CC-BY-4.0
      url: https://ec.europa.eu/eurostat/web/main/help/copyright-notice
      commercial_use: allowed
      attribution_required: true

  - match: ["data.gov"]
    license:
      name: US Government work, public domain (17 U.S.C. 105)
      spdx: PD-USGov
      url: https://www.data.gov/privacy-policy
      commercial_use: allowed
      attribution_required: false

  - match: ["census.gov", "api.census.gov"]
    license:
      name: US Government work, public domain
      spdx: PD-USGov
      url: https://www.census.gov/data/developers/about/terms-of-service.html
      commercial_use: allowed
      attribution_required: false

  - match: ["noaa.gov", "ncei.noaa.gov", "ncdc.noaa.gov"]
    license:
      name: US Government work, public domain (some products carry third party rights)
      spdx: PD-USGov
      url: https://www.noaa.gov/information-technology/open-data-dissemination
      commercial_use: allowed
      attribution_required: false

  - match: ["nasa.gov", "earthdata.nasa.gov", "api.nasa.gov"]
    license:
      name: US Government work, public domain unless stated otherwise
      spdx: PD-USGov
      url: https://www.nasa.gov/nasa-brand-center/images-and-media/
      commercial_use: allowed
      attribution_required: false

  - match: ["usgs.gov"]
    license:
      name: US Government work, public domain
      spdx: PD-USGov
      url: https://www.usgs.gov/information-policies-and-instructions/copyrights-and-credits
      commercial_use: allowed
      attribution_required: false

  - match: ["cdc.gov"]
    license:
      name: US Government work, public domain
      spdx: PD-USGov
      url: https://www.cdc.gov/other/agencymaterials.html
      commercial_use: allowed
      attribution_required: false

  - match: ["data.gov.uk", "ons.gov.uk", "statistics.gov.uk"]
    license:
      name: Open Government Licence v3.0
      spdx: OGL-UK-3.0
      url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
      commercial_use: allowed
      attribution_required: true

  - match: ["who.int", "who.data"]
    license:
      name: CC BY-NC-SA 3.0 IGO (WHO publications and data)
      spdx: CC-BY-NC-SA-3.0-IGO
      url: https://www.who.int/about/policies/publishing/copyright
      commercial_use: restricted
      attribution_required: true
      notes: Non-commercial reuse only without written permission.

  - match: ["openstreetmap.org", "osm.org"]
    license:
      name: Open Data Commons Open Database License 1.0
      spdx: ODbL-1.0
      url: https://www.openstreetmap.org/copyright
      commercial_use: allowed
      attribution_required: true
      notes: Share-alike applies to derived databases.

  - match: ["openfoodfacts.org", "world.openfoodfacts.org"]
    license:
      name: Open Database License 1.0 (data), CC BY-SA 3.0 (images)
      spdx: ODbL-1.0
      url: https://world.openfoodfacts.org/terms-of-use
      commercial_use: allowed
      attribution_required: true

  - match: ["crossref.org", "api.crossref.org"]
    license:
      name: Crossref metadata, CC0 1.0
      spdx: CC0-1.0
      url: https://www.crossref.org/documentation/retrieve-metadata/rest-api/rest-api-metadata-license-information/
      commercial_use: allowed
      attribution_required: false

  - match: ["openalex.org", "api.openalex.org"]
    license:
      name: OpenAlex data, CC0 1.0
      spdx: CC0-1.0
      url: https://docs.openalex.org/how-to-use-the-api/rate-limits-and-authentication
      commercial_use: allowed
      attribution_required: false

  - match: ["europepmc.org", "ebi.ac.uk"]
    license:
      name: Per record licence, often CC BY (Europe PMC metadata)
      spdx: null
      url: https://europepmc.org/developers
      commercial_use: unknown
      attribution_required: true

  - match: ["copernicus.eu", "dataspace.copernicus.eu", "scihub.copernicus.eu"]
    license:
      name: Copernicus data policy, free and open with attribution
      spdx: null
      url: https://www.copernicus.eu/en/access-data/copyright-and-licences
      commercial_use: allowed
      attribution_required: true

  - match: ["nlm.nih.gov", "ncbi.nlm.nih.gov", "pubmed.ncbi.nlm.nih.gov"]
    license:
      name: NLM terms, generally free reuse of US Government produced content
      spdx: null
      url: https://www.nlm.nih.gov/web_policies.html
      commercial_use: restricted
      attribution_required: true
      notes: Individual records can carry publisher restrictions.

  - match: ["ourworldindata.org"]
    license:
      name: CC BY 4.0 for OWID created data, third party series vary
      spdx: CC-BY-4.0
      url: https://ourworldindata.org/faqs
      commercial_use: allowed
      attribution_required: true

  - match: ["gist.github.com", "raw.githubusercontent.com", "github.com"]
    license:
      name: null
      spdx: null
      url: null
      commercial_use: unknown
      attribution_required: null

  - match: ["zenodo.org", "figshare.com", "datadryad.org", "osf.io"]
    license:
      name: Per record licence (repository aggregator)
      spdx: null
      url: null
      commercial_use: unknown
      attribution_required: null
      notes: Licence is set by the depositor, inspect the record page.

  - match: ["huggingface.co", "kaggle.com"]
    license:
      name: Per dataset licence (platform aggregator)
      spdx: null
      url: null
      commercial_use: unknown
      attribution_required: null
      notes: Licence is set by the dataset publisher, inspect the dataset card.

  - match: ["data.un.org", "un.org", "undata.un.org"]
    license:
      name: UN data terms, generally free reuse with attribution
      spdx: null
      url: https://www.un.org/en/about-us/terms-of-use
      commercial_use: restricted
      attribution_required: true
