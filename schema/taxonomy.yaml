# Taxonomy of the registry.
#
# `categories` is the closed set of primary categories (single value per entry).
# `tags` carry secondary domains. Every category must appear in categories.
# The *_map blocks translate upstream catalog categories into our taxonomy.
# Upstream values that are absent from a map fall back to `unknown`.
version: 1

categories:
  agriculture:
    label: Agriculture
    description: Crops, livestock, farmland, food production and agronomy data.
  ai-ml:
    label: AI and Machine Learning
    description: Model APIs, inference services, benchmark corpora and ML datasets.
  animals:
    label: Animals
    description: Species, breeds, wildlife, pets and veterinary resources.
  art-design:
    label: Art and Design
    description: Images, museums, architecture, stock media and design assets.
  blockchain-crypto:
    label: Blockchain and Crypto
    description: Ledgers, tokens, wallets, on-chain analytics and smart contracts.
  business-commerce:
    label: Business and Commerce
    description: Company data, CRM, ecommerce, invoicing and marketplace services.
  climate-environment:
    label: Climate and Environment
    description: Emissions, air quality, biodiversity, hydrology and climate projections.
  cloud-infrastructure:
    label: Cloud and Infrastructure
    description: Compute, storage, hosting, containers and platform services.
  communication:
    label: Communication
    description: Email, SMS, chat, voice and notification services.
  data-analytics:
    label: Data and Analytics
    description: General analytics, statistical series, time series and BI sources.
  developer-tools:
    label: Developer Tools
    description: APIs and datasets for building, testing and shipping software.
  documents-productivity:
    label: Documents and Productivity
    description: Files, calendars, notes, office formats and workflow tools.
  earth-sciences:
    label: Earth Sciences
    description: Geology, geophysics, soil, oceans and planetary surface data.
  economics:
    label: Economics
    description: Macro and micro indicators, trade, labour and price statistics.
  education:
    label: Education
    description: Schools, universities, learning content and assessment data.
  energy:
    label: Energy
    description: Electricity, fuels, renewables, grid and consumption data.
  entertainment-media:
    label: Entertainment and Media
    description: Film, music, books, comics, games metadata and streaming catalogues.
  finance:
    label: Finance
    description: Markets, exchanges, forex, fundamentals, filings and banking data.
  food-nutrition:
    label: Food and Nutrition
    description: Recipes, ingredients, nutrition facts and food composition tables.
  games:
    label: Games
    description: Game metadata, stats, assets and player telemetry.
  geospatial:
    label: Geospatial
    description: Maps, boundaries, addresses, imagery, elevation and routing.
  government:
    label: Government
    description: Public sector services, legislation, registries and civic data.
  health-medical:
    label: Health and Medical
    description: Clinical, epidemiological, pharmaceutical and biomedical resources.
  identity-security:
    label: Identity and Security
    description: Authentication, threat intelligence, malware, fraud and vulnerability data.
  interdisciplinary:
    label: Interdisciplinary
    description: Cross-domain collections that do not fit one primary category.
  iot:
    label: IoT and Devices
    description: Sensors, home automation, device telemetry and embedded platforms.
  jobs-hr:
    label: Jobs and HR
    description: Job boards, labour market, recruiting and workforce data.
  legal:
    label: Legal
    description: Case law, statutes, contracts and regulatory material.
  life-sciences:
    label: Life Sciences
    description: Genomics, proteomics, microbiology and model organism data.
  logistics-transportation:
    label: Logistics and Transportation
    description: Flights, transit, shipping, vehicle and mobility data.
  manufacturing-industry:
    label: Manufacturing and Industry
    description: Production, materials, supply chains and industrial telemetry.
  marketing-social:
    label: Marketing and Social
    description: Social platforms, audience, advertising and brand monitoring.
  mathematics:
    label: Mathematics
    description: Constants, sequences, theorem libraries and formal proofs.
  neuroscience:
    label: Neuroscience
    description: Brain imaging, electrophysiology, connectomics and cognition data.
  news-journalism:
    label: News and Journalism
    description: Articles, feeds, archives, fact checking and media monitoring.
  open-data:
    label: Open Data Portals
    description: Multi-domain government and institutional open data catalogues.
  patent-ip:
    label: Patents and IP
    description: Patent offices, trademarks, prior art and citation data.
  payments:
    label: Payments
    description: Payment processing, billing, payouts and financial infrastructure.
  physical-sciences:
    label: Physical Sciences
    description: Physics, chemistry, materials and astronomy research data.
  science-research:
    label: Science and Research
    description: General scholarly, preprint, citation and research infrastructure.
  search:
    label: Search
    description: Web, document and semantic search services.
  social-sciences:
    label: Social Sciences
    description: Demographics, surveys, psychology, sociology and political data.
  space:
    label: Space
    description: Satellites, orbital data, astronomy imagery and space weather.
  sports-fitness:
    label: Sports and Fitness
    description: Fixtures, results, performance, health tracking and esports.
  telecommunications:
    label: Telecommunications
    description: Networks, phone numbers, carriers, messaging infrastructure and connectivity.
  test-data:
    label: Test Data
    description: Fake, sample and synthetic data for development and QA.
  travel:
    label: Travel
    description: Places, lodging, flights, points of interest and trip planning.
  unknown:
    label: Uncategorised
    description: Not yet classified. Triage queue for curation.
  weather-climate:
    label: Weather and Climate
    description: Forecasts, observations, radar, climate reanalysis and warnings.

